<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <div class="main-logo-and-theme">
      <h2 class="main-logo-text">calc</h2>
      <div class="main-theme">
        <h6 class="main-theme-text">THEME</h6>
        <div class="main-theme-button">
          <button class="main-theme-button-round"></button>
        </div>
      </div>
    </div>
    <div class="main-calculator">
      <div class="main-calculator-screen">
        <h2 class="main-calculator-screen-text">0</h2>
        <p class="main-calculator-screen-bottom-text"></p>
      </div>
      <div class="main-calculator-keyboard">
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="7">7</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="8">8</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="9">9</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-delete" id="deleteButton">DEL</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="4">4</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="5">5</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="6">6</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-operator" value="+">+</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="1">1</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="2">2</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="3">3</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-operator" value="-">-</button>
        <button class="main-calculator-keyboard-button" value="." id="dotButton">.</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-number" value="0">0</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-operator" value="/">/</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-operator" value="*">x</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-reset" id="resetButton">RESET</button>
        <button class="main-calculator-keyboard-button main-calculator-keyboard-button-calculate" id="calculateButton">=</button>
      </div>
    </div>
  </main>
  
  <script src="./script.js"></script>
</body>
</html>
